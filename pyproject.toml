[project]
name = "comfyui-image-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "aiohttp>=3.11.8",
    "numpy>=1.25.0",
    "Pillow>=10.1.0",
]

[project.optional-dependencies]
pose = ["playwright==1.64.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["image_service/tests"]
pythonpath = [".", "../.."]
addopts = "--import-mode=importlib"

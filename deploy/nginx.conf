# Include inside nginx's http {} context. Replace domain and certificate paths.
limit_conn_zone $binary_remote_addr zone=qwen_connections:1m;
limit_req_zone $binary_remote_addr zone=qwen_requests:1m rate=10r/m;

server {
    listen 443 ssl;
    server_name image.example.com;
    ssl_certificate /etc/ssl/qwen/fullchain.pem;
    ssl_certificate_key /etc/ssl/qwen/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 128m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    client_body_in_file_only off;
    # This directory must be a verified, non-swapping tmpfs. It is a backstop,
    # not the normal upload path. See README before enabling this server.
    client_body_temp_path /run/qwen-nginx/body;
    proxy_temp_path /run/qwen-nginx/proxy;
    access_log off;
    error_log /dev/null crit;

    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_store off;
    proxy_next_upstream off;
    proxy_ignore_client_abort off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 65s;
    proxy_read_timeout 1800s;
    send_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    location = /api/image/edit {
        limit_except POST { deny all; }
        limit_conn qwen_connections 3;
        limit_conn_status 429;
        limit_req zone=qwen_requests burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/api/image/edit/[^/]+/cancel$ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/pose/search {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location = /ready {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location / { return 404; }
}
